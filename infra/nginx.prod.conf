pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  map $uri $route_category {
    default page;
    ~^/api/ api;
    ~^/assets/ asset;
  }
  map $request_method $method_category {
    default other;
    GET GET;
    HEAD HEAD;
    POST POST;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
  }
  log_format fillable escape=json '{"event":"gateway_request","route":"$route_category","method":"$method_category","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time}';
  access_log /dev/stdout fillable;
  # Native request-error messages include raw URIs/headers; use safe status events.
  # Startup and explicit nginx -t diagnostics remain available to the operator.
  error_log /dev/null warn;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    server_tokens off;
    error_page 413 = @oversized;
    location @oversized {
      default_type application/json;
      add_header Cache-Control no-store always;
      return 413 '{"error":{"code":"file_too_large","parameters":{}}}';
    }
    root /usr/share/nginx/html;
    location ~ "^/api/documents/[0-9a-fA-F-]{36}/versions$" {
      client_max_body_size 64m;
      proxy_request_buffering off;
      proxy_http_version 1.1;
      proxy_pass http://api:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
      client_max_body_size 24m;
      proxy_request_buffering off;
      proxy_http_version 1.1;
      proxy_pass http://api:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
