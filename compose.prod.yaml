services:
  db:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  worker:
    restart: unless-stopped
  api:
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
  dispatcher:
    restart: unless-stopped
  maintenance:
    restart: unless-stopped
  gateway:
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FILLABLE_UPSTREAM_PORT:-8181}:8080'
