[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = []

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["defusedxml.*"]
ignore_missing_imports = true
