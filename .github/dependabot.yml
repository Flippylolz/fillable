# Dependabot version updates for supported ecosystems.
#
# Backend Python dependencies are intentionally absent: they are compiled by
# pip-tools into the hash-pinned `backend/requirements.lock`, which Dependabot
# does not recognize as a manifest (it supports `.txt` requirement files and
# PEP 621 `pyproject.toml`). A pull request that bumped `backend/requirements.in`
# alone would leave the installed lock unchanged and drift from it. Backend
# dependency updates stay on the documented manual pip-compile procedure in
# AI/LOCAL_DEVELOPMENT.md.
#
# Minor and patch updates are grouped into one pull request per ecosystem;
# major updates open standalone pull requests for review. Every pull request
# must pass the required `ci-required` gate regardless of origin.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compose-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
