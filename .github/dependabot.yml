# Dependabot version updates for supported ecosystems.
#
# Backend Python dependencies are covered through the pip ecosystem: the
# hash-pinned pip-compile output lives at `backend/requirements.txt`, which
# Dependabot recognizes as a pip-compile lockfile (it recompiles it with its
# bundled pip-compile 7.5.3, the same pip-tools version documented in
# AI/LOCAL_DEVELOPMENT.md) and updates it together with `requirements.in` in
# one pull request.
#
# Minor and patch updates are grouped into one pull request per ecosystem;
# major updates open standalone pull requests for review. Every pull request
# must pass the required `ci-required` gate regardless of origin.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compose-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
