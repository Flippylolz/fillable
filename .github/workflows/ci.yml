name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  FILLABLE_PUBLIC_ORIGIN: http://gateway:8080
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure isolated local defaults
        run: cp .env.example .env
      - name: Build check images
        run: docker compose -p fillable-checks -f compose.test.yaml build
      - name: Lint and type-check backend
        run: docker compose -p fillable-checks -f compose.test.yaml run --rm --no-deps backend-test sh -c 'ruff check . && mypy app'
      - name: Lint, validate catalogs and build frontend
        run: docker compose -p fillable-checks -f compose.test.yaml run --rm --no-deps frontend-test sh -c 'npm run lint && npm run check:i18n && npm run build'
      - name: Check generated API drift
        run: |
          docker compose -p fillable-checks -f compose.test.yaml run --rm --no-deps --user "$(id -u):$(id -g)" -v "$PWD/frontend/generated:/output" backend-test python /checks/export_openapi.py /output/openapi.json
          docker compose -p fillable-checks -f compose.test.yaml run --rm --no-deps --user "$(id -u):$(id -g)" -v "$PWD/frontend/generated:/app/generated" frontend-test npm run generate:api
          git diff --exit-code -- frontend/generated
      - name: Check source-derived editor fixture drift
        run: |
          docker compose -p fillable-checks -f compose.test.yaml run --rm --no-deps --user "$(id -u):$(id -g)" -v "$PWD/frontend/prototype:/output" backend-test python /checks/export_editor_fixture.py /output/document.json /output/fields.json
          git diff --exit-code -- frontend/prototype
      - name: Check editor dependency notices
        run: |
          docker compose -p fillable-checks -f compose.test.yaml run --rm --no-deps --user "$(id -u):$(id -g)" -v "$PWD/frontend/public:/app/public" frontend-test node scripts/editor-notices.mjs
          git diff --exit-code -- frontend/public/editor-notices.txt
      - name: Validate runtime Compose configurations
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build backend check image
        run: docker compose -p fillable-checks -f compose.test.yaml build backend-test
      - name: Backend tests and coverage
        run: docker compose -p fillable-checks -f compose.test.yaml run --name fillable-backend-check backend-test
      - name: Verify coverage provenance and aggregation gate contracts
        run: |
          docker compose -p fillable-checks -f compose.test.yaml run --rm --no-deps -v "$PWD/.github/workflows/ci.yml:/checks/ci.yml:ro" backend-test sh -c 'python /checks/test_coverage_provenance.py && python /checks/test_gate_contract.py'
      - name: Reject real unimported backend source
        run: docker compose -p fillable-checks -f compose.test.yaml run --rm backend-test python /checks/probe_backend_coverage.py
      - name: Collect reports
        if: always()
        run: |
          mkdir -p reports/backend
          docker cp fillable-backend-check:/app/coverage/. reports/backend/ || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-backend
          path: reports/
          if-no-files-found: error
  frontend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build frontend check image
        run: docker compose -p fillable-checks -f compose.test.yaml build frontend-test
      - name: Frontend tests and coverage
        run: docker compose -p fillable-checks -f compose.test.yaml run --name fillable-frontend-check frontend-test
      - name: Validate frontend raw coverage and full source inclusion
        run: |
          mkdir -p frontend/coverage
          docker cp fillable-frontend-check:/app/coverage/. frontend/coverage/
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/scripts:/checks:ro" \
            -v "$PWD/frontend:/source:ro" \
            -v "$PWD/frontend/coverage:/source/coverage:ro" \
            python:3.13.12-slim-bookworm@sha256:a58daefb915e1e03ad48f3ca4df8832065412c5c35cacb9d39f4229184de12b6 \
            python /checks/check_coverage.py frontend /source
      - name: Reject real unimported frontend source
        run: docker compose -p fillable-checks -f compose.test.yaml run --rm --no-deps frontend-test node scripts/probe-coverage.mjs
      - name: Collect reports
        if: always()
        run: |
          mkdir -p reports/frontend
          docker cp fillable-frontend-check:/app/coverage/. reports/frontend/ || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-frontend
          path: reports/
          if-no-files-found: error
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure isolated local defaults
        run: cp .env.example .env
      - name: Build and verify production gateway
        run: |
          export VITE_APP_COMMIT_SHA="$(git rev-parse HEAD)"
          docker compose -p fillable-ci -f compose.yaml -f compose.prod.yaml up --build --wait --wait-timeout 120
          docker compose -p fillable-ci -f compose.yaml -f compose.prod.yaml exec -T gateway nginx -t -c /etc/nginx/fillable.conf
          docker compose -p fillable-ci -f compose.yaml -f compose.prod.yaml exec -T api python -m app.accounts.cli provision --email browser-user --display-name "Тестовий користувач" --language en --password-stdin < fixtures/auth/browser-password.txt
          docker compose -p fillable-ci -f compose.yaml -f compose.prod.yaml exec -T api python -m app.accounts.cli provision --email profile@example.test --display-name "Тест профілю" --language uk --password-stdin < fixtures/auth/browser-password.txt
          docker compose -p fillable-ci -f compose.yaml -f compose.prod.yaml exec -T api python -m app.accounts.cli provision --email library@example.test --display-name "Тест бібліотеки" --language uk --password-stdin < fixtures/auth/browser-password.txt
          docker compose -p fillable-ci -f compose.yaml -f compose.prod.yaml exec -T api python -m app.accounts.cli provision --email review@example.test --display-name "Перевірка полів" --language uk --password-stdin < fixtures/auth/browser-password.txt
          docker compose -p fillable-ci -f compose.yaml -f compose.prod.yaml exec -T api python -m app.accounts.cli provision --email lease-desktop@example.test --display-name "Перевірка доступу" --language uk --password-stdin < fixtures/auth/browser-password.txt
          docker compose -p fillable-ci -f compose.yaml -f compose.prod.yaml exec -T api python -m app.accounts.cli provision --email lease-mobile@example.test --display-name "Перевірка доступу" --language uk --password-stdin < fixtures/auth/browser-password.txt
          docker compose -p fillable-ci -f compose.yaml -f compose.prod.yaml exec -T api python /checks/verify_gateway_logs.py probe
          mkdir -p reports
          docker compose -p fillable-ci -f compose.yaml -f compose.prod.yaml logs --no-color --no-log-prefix gateway > reports/gateway.log
          docker compose -p fillable-ci -f compose.yaml -f compose.prod.yaml exec -T api python /checks/verify_gateway_logs.py check < reports/gateway.log
          curl --fail http://127.0.0.1:8181/api/health
          curl --fail http://127.0.0.1:8181/ | grep '/assets/'
      - name: Browser smoke tests
        run: |
          docker compose -p fillable-ci -f compose.yaml -f compose.prod.yaml -f compose.browser.yaml build browser
          docker compose -p fillable-ci -f compose.yaml -f compose.prod.yaml -f compose.browser.yaml run --name fillable-browser-check -e EXPECTED_APP_VERSION="$(git rev-parse --short=7 HEAD)" browser
      - name: Stop isolated runtime
        if: always()
        run: |
          docker compose -p fillable-ci -f compose.yaml -f compose.prod.yaml down
      - name: Collect reports
        if: always()
        run: |
          mkdir -p reports/browser
          docker cp fillable-browser-check:/app/test-results/. reports/browser/ || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-evidence
          path: reports/
          if-no-files-found: error
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify clean development, reload and persistence
        run: FILLABLE_BROWSER_REPORTS="$PWD/reports/editor" scripts/verify-development.sh
      - name: Verify independent DOCX rendering
        run: scripts/verify-docx-render.sh reports/editor
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: development-reports
          path: reports/
          if-no-files-found: error
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure isolated local defaults
        run: cp .env.example .env
      - name: Build backend check image
        run: docker compose -p fillable-checks -f compose.test.yaml build backend-test
      - name: Verify release, runtime and public release contracts
        run: |
          docker compose -p fillable-checks -f compose.test.yaml run --rm --no-deps backend-test sh -c 'python /checks/test_release_contract.py && python /checks/test_runtime_contract.py && python /checks/test_public_release.py && python /checks/test_public_persistence.py'
          docker compose -p fillable-checks -f compose.test.yaml run --rm --no-deps -v "$PWD:/source:ro" backend-test python /checks/test_deploy_dispatch_contract.py /source
          docker compose -p fillable-checks -f compose.test.yaml run --rm --no-deps -v "$PWD:/source:ro" backend-test python /checks/test_dependabot_automerge_contract.py /source
          python3 scripts/test_smoke_transport.py
          sh scripts/verify-server-runtime.sh
  upgrade-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify previous-image upgrade and full-application crash recovery
        run: FILLABLE_RECOVERY_REPORTS="$PWD/reports/recovery" scripts/verify-application-recovery.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: application-recovery
          path: reports/recovery/
          if-no-files-found: error
  ci-required:
    if: always()
    needs: [lint, backend-tests, frontend-tests, browser, development, contracts, upgrade-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require every check to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DEVELOPMENT_RESULT: ${{ needs.development.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          UPGRADE_RESULT: ${{ needs.upgrade-checks.result }}
        run: scripts/require-ci-success.sh "$LINT_RESULT" "$BACKEND_RESULT" "$FRONTEND_RESULT" "$BROWSER_RESULT" "$DEVELOPMENT_RESULT" "$CONTRACTS_RESULT" "$UPGRADE_RESULT"
