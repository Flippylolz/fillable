# Trusted base-branch orchestration only: never check out or execute PR code.
# GitHub alone merges after strict, current-head ci-required checks succeed.
name: Dependabot auto-merge
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-automerge-reconcile
  cancel-in-progress: false

jobs:
  automerge:
    if: >-
      github.repository == 'Flippylolz/fillable' &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_run' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event.pull_request.user.login == 'dependabot[bot]'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reconcile current Dependabot heads and held CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import time

          REPO = os.environ["REPO"]
          FAILED = {"failure", "cancelled", "timed_out", "startup_failure", "stale"}


          def api(path, method="GET", fields=None, pages=False):
              command = ["gh", "api", "--method", method, f"repos/{REPO}/{path}"]
              if pages:
                  command += ["--paginate", "--slurp"]
              for key, value in (fields or {}).items():
                  command += ["-f", f"{key}={value}"]
              output = subprocess.check_output(command, text=True)
              return json.loads(output) if output.strip() else None


          def trusted(pr):
              return (
                  pr["state"] == "open"
                  and not pr["draft"]
                  and pr["user"]["login"] == "dependabot[bot]"
                  and pr["head"]["repo"] is not None
                  and pr["head"]["repo"]["full_name"] == REPO
                  and pr["head"]["ref"].startswith("dependabot/")
                  and pr["base"]["repo"]["full_name"] == REPO
                  and pr["base"]["ref"] == "main"
              )


          def current(number, head):
              pr = api(f"pulls/{number}")
              if not trusted(pr) or pr["head"]["sha"] != head:
                  raise RuntimeError(f"PR #{number} changed during reconciliation")
              return pr


          def reconcile(number):
              pr = api(f"pulls/{number}")
              if not trusted(pr):
                  return
              head = pr["head"]["sha"]
              if api(f"compare/main...{head}")["behind_by"] > 0:
                  api(f"pulls/{number}/update-branch", "PUT", {"expected_head_sha": head})
                  # Updating is asynchronous. Never look for runs at the OLD head.
                  for attempt in range(10):
                      pr = api(f"pulls/{number}")
                      if not trusted(pr):
                          raise RuntimeError(f"PR #{number} is no longer eligible")
                      if pr["head"]["sha"] != head:
                          head = pr["head"]["sha"]
                          break
                      time.sleep(2)
                  else:
                      raise RuntimeError(f"PR #{number} branch update is still pending")
                  print(f"PR #{number}: updated to {head}")
              # Also recover already-current branches and late-created held runs.
              pages = api(
                  f"actions/workflows/ci.yml/runs?event=pull_request&head_sha={head}&per_page=100",
                  pages=True,
              )
              runs = [
                  run
                  for page in pages
                  for run in page["workflow_runs"]
                  if (
                      run["event"] == "pull_request"
                      and run["path"] == ".github/workflows/ci.yml"
                      and run["head_sha"] == head
                      and run["head_repository"]["full_name"] == REPO
                      and any(
                          p["number"] == number and p["head"]["sha"] == head
                          for p in run["pull_requests"]
                      )
                  )
              ]
              if runs:
                  run = max(runs, key=lambda value: value["id"])
                  if run["conclusion"] == "action_required":
                      current(number, head)
                      api(f"actions/runs/{run['id']}/approve", "POST")
                      print(f"PR #{number}: approved CI run {run['id']} at {head}")
                  elif run["conclusion"] in FAILED:
                      print(f"PR #{number}: CI {run['conclusion']}; a fixing push is required")
                      return
              pr = current(number, head)
              if pr["auto_merge"] is None:
                  subprocess.run(
                      [
                          "gh",
                          "pr",
                          "merge",
                          "--repo",
                          REPO,
                          "--auto",
                          "--squash",
                          "--match-head-commit",
                          head,
                          str(number),
                      ],
                      check=True,
                  )
              print(f"PR #{number}: auto-merge armed at {head}; required checks still apply")


          def main():
              if REPO != "Flippylolz/fillable":
                  raise RuntimeError("Unexpected repository")
              failed = []
              for page in api("pulls?state=open&base=main&per_page=100", pages=True):
                  for pr in page:
                      if not trusted(pr):
                          continue
                      try:
                          reconcile(pr["number"])
                      except Exception as error:
                          print(f"::error::PR #{pr['number']}: {error}")
                          failed.append(pr["number"])
              if failed:
                  raise RuntimeError(f"Reconciliation failed for PRs {failed}")


          if __name__ == "__main__":
              main()
