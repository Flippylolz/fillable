name: fillable-checks
services:
  backend-test:
    volumes:
      - ./fixtures:/fixtures:ro
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      FILLABLE_PUBLIC_ORIGIN: http://testserver
      DATABASE_URL: postgresql+psycopg://fillable:test-only@test-db:5432/fillable
      REDIS_URL: redis://test-redis:6379/0
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    command: sh -c 'rm -rf coverage && python /checks/coverage_provenance.py backend /app pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=json:coverage/coverage.json && python /checks/check_coverage.py backend /app && python /checks/test_coverage_gate.py'
  frontend-test:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      target: frontend
    command: sh -c 'rm -rf coverage && node scripts/coverage-provenance.mjs'
  test-db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: fillable
      POSTGRES_DB: fillable
      POSTGRES_PASSWORD: test-only
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fillable -d fillable']
      interval: 2s
      timeout: 3s
      retries: 20
  test-redis:
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
