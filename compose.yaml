name: ${COMPOSE_PROJECT_NAME:-fillable-local}
services:
  api:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    init: true
    environment:
      STORAGE_ROOT: /data/documents
    volumes:
      - ${DOCUMENTS_HOST_PATH:-./var/storage}:/data/documents
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]
  gateway:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      target: gateway-prod
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/health']
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
