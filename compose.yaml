name: ${COMPOSE_PROJECT_NAME:-fillable-local}
services:
  api:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    init: true
    environment:
      FILLABLE_PUBLIC_ORIGIN: ${FILLABLE_PUBLIC_ORIGIN:?Set FILLABLE_PUBLIC_ORIGIN in .env}
      STORAGE_ROOT: /data/documents
      STORAGE_FILE_BYTES: ${STORAGE_FILE_BYTES:-10485760}
      STORAGE_STAGING_BYTES: ${STORAGE_STAGING_BYTES:-67108864}
      STORAGE_DISK_HEADROOM_BYTES: ${STORAGE_DISK_HEADROOM_BYTES:-67108864}
      STORAGE_LEASE_SECONDS: ${STORAGE_LEASE_SECONDS:-60}
      DATABASE_URL: postgresql+psycopg://fillable:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/fillable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ${DOCUMENTS_HOST_PATH:-./var/storage}:/data/documents
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 10
    security_opt: [no-new-privileges:true]
  storage-init:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    user: "0:0"
    command: [python, -c, "from pathlib import Path; from app.storage.filesystem import initialize; initialize(Path('/data/documents'))"]
    volumes:
      - ${DOCUMENTS_HOST_PATH:-./var/storage}:/data/documents
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
  db:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    environment:
      POSTGRES_USER: fillable
      POSTGRES_DB: fillable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fillable -d fillable']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.6.1-alpine@sha256:2afba59292f25f5d1af200496db41bea2c6c816b059f57ae74703a50a03a27d0
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://fillable:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/fillable
    depends_on:
      db:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    command: rq worker --config app.worker_config --serializer rq.serializers.JSONSerializer --disable-job-desc-logging
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://fillable:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/fillable
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/documents
      STORAGE_FILE_BYTES: ${STORAGE_FILE_BYTES:-10485760}
      STORAGE_STAGING_BYTES: ${STORAGE_STAGING_BYTES:-67108864}
      STORAGE_DISK_HEADROOM_BYTES: ${STORAGE_DISK_HEADROOM_BYTES:-67108864}
      STORAGE_LEASE_SECONDS: ${STORAGE_LEASE_SECONDS:-60}
    volumes:
      - ${DOCUMENTS_HOST_PATH:-./var/storage}:/data/documents
    depends_on:
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
  dispatcher:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    command: python -m app.jobs.dispatcher
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://fillable:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/fillable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
  maintenance:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    command: python -m app.maintenance
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://fillable:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/fillable
      PGOPTIONS: "-c statement_timeout=5000 -c lock_timeout=2000"
      STORAGE_ROOT: /data/documents
      STORAGE_FILE_BYTES: ${STORAGE_FILE_BYTES:-10485760}
      STORAGE_STAGING_BYTES: ${STORAGE_STAGING_BYTES:-67108864}
      STORAGE_DISK_HEADROOM_BYTES: ${STORAGE_DISK_HEADROOM_BYTES:-67108864}
      STORAGE_LEASE_SECONDS: ${STORAGE_LEASE_SECONDS:-60}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-60}
      MAINTENANCE_BATCH: ${MAINTENANCE_BATCH:-20}
    volumes:
      - ${DOCUMENTS_HOST_PATH:-./var/storage}:/data/documents
    depends_on:
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
  gateway:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      target: gateway-prod
      args:
        VITE_APP_COMMIT_SHA: ${VITE_APP_COMMIT_SHA:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/health']
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
volumes:
  postgres-data:
  redis-data:
